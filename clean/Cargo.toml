[package]
name = "cleanfix"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Clean and Fix: inspect any DWG/DXF and write a clean copy (uses acadrust, MPL-2.0, unmodified)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acadrust = { version = "=0.6.7", default-features = false }
serde_json = "1"
wasm-bindgen = "0.2"

[[bin]]
name = "cleanfix"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
