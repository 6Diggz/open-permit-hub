# cargo-deny: license allowlist for the crates compiled into cleanfix_bg.wasm (and the native test binary).
# Copyleft beyond MPL-2.0 (file-level, used unmodified) is not allowed. CI: cargo deny check licenses
[graph]
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD", "Zlib", "Unlicense", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "BSL-1.0", "CC0-1.0"]
confidence-threshold = 0.9
