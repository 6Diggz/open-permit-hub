name: Rule sources watch
# Weekly: has the LADBS correction sheet changed? Each December: open the new-laws checklist for January 1.
on:
  schedule:
    - cron: "17 15 * * 1"
    - cron: "23 15 1 12 *"
  workflow_dispatch:
permissions: { contents: read, issues: write }
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Check sources and verbatim text
        id: w
        run: |
          sudo apt-get install -y poppler-utils >/dev/null
          node scripts/rules-watch.mjs > watch.md || echo "changed=1" >> "$GITHUB_OUTPUT"
          cat watch.md
      - name: Open an issue when a source changed
        if: steps.w.outputs.changed == '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue create --title "Rule source changed: review the rule pack" --body-file watch.md --label rules || gh issue create --title "Rule source changed: review the rule pack" --body-file watch.md
      - name: New-laws checklist (December)
        if: github.event.schedule == '23 15 1 12 *'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue create --title "New California ADU laws start January 1: review the rule pack" --body "Check the HCD ADU Handbook update and new chaptered bills, update app/src/rules, bump PACK.version, verifiedOn and reviewBy in app/src/rules/pack.ts, and note it in CHANGELOG.md."
